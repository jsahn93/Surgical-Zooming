name: Build Surgical Zooming Executable (PR)

on:
  pull_request:
    branches:
      - master
      - main
      - develop

jobs:
  build-windows-pr:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip
          .venv\Scripts\python -m pip install -r requirements.txt

      - name: Build executable with PyInstaller
        run: |
          .venv\Scripts\pyinstaller --noconfirm --onefile --windowed --name "SurgicalZooming" main.py

      - name: Upload build artifact (PR)
        uses: actions/upload-artifact@v4
        with:
          name: SurgicalZooming-windows-PR
          path: dist/SurgicalZooming.exe
