name: Build Surgical Zooming Executable

on:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip
          .venv\Scripts\python -m pip install -r requirements.txt

      - name: Build executable with PyInstaller
        run: |
          .venv\Scripts\pyinstaller --noconfirm --onefile --windowed --name "SurgicalZooming" main.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SurgicalZooming-windows
          path: dist/SurgicalZooming.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SurgicalZooming.exe

