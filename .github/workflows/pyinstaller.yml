# Build Surgical Zooming as a single-file Windows .exe and publish to GitHub Release.
# Runs only on tag push matching v* (e.g. v1.0.0). Uses a clean Windows runner to
# avoid local path/registry quirks affecting the binary.

name: PyInstaller Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Build executable with PyInstaller
        run: pyinstaller SurgicalZooming.spec

      - name: Upload executable as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SurgicalZooming-exe
          path: dist/SurgicalZooming.exe

      - name: Create GitHub Release and attach executable
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SurgicalZooming.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
